<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Host Quiz</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card host-card">
        <h2>Host Quiz</h2>

        <input id="passcode" placeholder="Passcode" />
        <input id="duration" type="number" placeholder="Duration (minutes)" />
        <input id="startTime" type="datetime-local" />

        <button onclick="host()">Start Hosting</button>

        <h3>Previous Hosting History</h3>
        <div id="historyList"></div>
      </div>
    </div>

    <script src="../js/host-quiz.js"></script>
  </body>
</html>
